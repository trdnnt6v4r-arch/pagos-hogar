        <div class="campo"><label for="gIps">Descuento IPS 9 %</label><input id="gIps" inputmode="numeric" value="${E(C.miles(base.ipsTrabajador))}"></div>
        <div class="campo"><label for="gAdel">Adelanto descontado</label><input id="gAdel" inputmode="numeric" value="${E(C.miles(base.adelantoDescontado))}"><span class="ayuda" id="gAdelAyuda"></span></div>
      </div>
      <div class="cuenta"><span>Total a entregar</span><strong id="gNeto"></strong></div>
      <div class="doble" style="margin-top:12px">
        <div class="campo"><label for="gMedio">Medio</label><select id="gMedio">${MEDIOS.map(m => `<option${m === base.medio ? ' selected' : ''}>${m}</option>`).join('')}</select></div>
        <div class="campo"><label for="gNota">Nota</label><input id="gNota" maxlength="200" value="${E(base.nota)}"></div>
      </div>
      <p class="error" id="gError" role="alert"></p>
    </form>`,
    `${nuevo ? '' : `<button class="btn peligro" data-accion="anularPago" data-id="${E(pago.id)}">${pago.anulado ? 'Restaurar' : 'Anular'}</button>`}
     <button class="btn${nuevo ? ' grande' : ''}" id="gBoton" data-accion="guardarPago" data-id="${nuevo ? '' : E(pago.id)}">Guardar</button>`);

  const fmt = id => { const el = document.getElementById(id); const n = num(el.value); el.value = n ? C.miles(n) : (el.value === '' ? '' : '0'); };
  const neto = () => {
    const n = num(val('gMonto')) - num(val('gIps')) - num(val('gAdel'));
    $('#gNeto').innerHTML = G(n);
    if (nuevo) $('#gBoton').textContent = `Registrar ${GT(n)}`;
    const per = persona(val('gPersona'));
    const t = val('gTipo');
    $('#gResumen').innerHTML = `<span class="av" style="--c:${per ? colorDe(per.id) : '#5d636b'}" aria-hidden="true">${E(iniciales(per ? per.nombre : '?'))}</span><div><b>${E(per ? per.nombre : 'Elige a la persona')}</b><span>${E(C.TIPOS[t] || '')}${t !== 'adelanto' && val('gDesde') && val('gHasta') ? ' · ' + E(C.etiquetaPeriodo(val('gDesde'), val('gHasta'))) : ''}</span></div>`;
  };
  const ipsDe = (p, tipo, monto) => (p && p.ips && C.REMUNERATIVOS.includes(tipo) ? Math.round(monto * S.config.ipsTrabajador) : 0);

  function sugerir() {
    const p = persona(val('gPersona'));
    const tipo = val('gTipo');
    const fecha = val('gFecha') || hoy;
    $('#cDias').hidden = tipo !== 'vacaciones';
    $('#cPeriodo').hidden = tipo === 'adelanto';
    const sinDescuentos = tipo === 'aguinaldo' || tipo === 'adelanto';
    $('#cDescuentos').hidden = sinDescuentos;
    const saldo = p ? C.saldoAdelantos(S.pagos.filter(x => !pago || x.id !== pago.id), p.id) : 0;
    $('#gAdelAyuda').textContent = saldo > 0 ? `Saldo pendiente: ${C.miles(saldo)}` : '';
    if (!nuevo || !p) { neto(); return; }
    let desde = fecha, hasta = fecha, monto = 0, sug = '';
    if (tipo === 'sueldo' && p.frecuencia === 'variable') {
      sug = 'Pago por día u hora: escribe el período y el monto de lo trabajado.';
    } else if (tipo === 'sueldo') {
      const est = C.estadoPersona(p, S.pagos, fecha);
      const per = est.proximo || C.periodos(Object.assign({}, p, { controlDesde: C.sumarDias(est.ultimoPagado || p.fechaIngreso, 1) }), C.sumarDias(fecha, 31))[0];
      if (per) { desde = per.desde; hasta = per.hasta; monto = per.monto; sug = per.completo ? 'Es el primer sueldo que falta pagar.' : 'Es el primer sueldo que falta pagar; el monto es proporcional a los días trabajados.'; }
    } else if (tipo === 'aguinaldo') {
      let y = fecha.slice(0, 4);
      if (fecha.slice(5, 7) === '01' && C.aguinaldo(S.pagos, p.id, String(+y - 1)).pendiente > 0) y = String(+y - 1);
      const ag = C.aguinaldo(S.pagos, p.id, y);
      desde = y + '-01-01'; hasta = y + '-12-31'; monto = ag.pendiente;
      sug = `Doceava parte de ${C.miles(ag.base)} cobrados en ${y}. El aguinaldo se paga entero, sin descuentos.`;
    } else if (tipo === 'bonificacion') {
      const per = C.periodoQueContiene(fecha, 'mensual'); desde = per.desde; hasta = per.hasta; monto = C.bonificacionFamiliar(p, S.config);
      sug = `5 % del mínimo por cada hijo menor de 17 (${p.hijosMenores || 0}).`;
    } else if (tipo === 'vacaciones') {
      const vac = C.vacaciones(p, S.pagos, fecha);
      sug = `Tiene ${vac.pendientes} días pendientes. Salario diario: ${C.miles(Math.round(p.sueldoMensual / 30))} (sueldo ÷ 30).`;
    } else if (tipo === 'extra') {
      sug = `Hora ordinaria: ${C.miles(Math.round(p.sueldoMensual / 30 / 8))} (sueldo ÷ 30 ÷ 8, Res. MTESS 670/2026).`
        + ` Hora extra: +50 % (art. 234 del Código); feriado o descanso trabajado: doble (folleto MTESS, p. 5).`;
    } else if (tipo === 'adelanto') {
      sug = 'Se descontará de un pago posterior.';
    }
    $('#gDesde').value = desde; $('#gHasta').value = hasta;
    $('#gMonto').value = C.miles(monto);
    $('#gIps').value = C.miles(ipsDe(p, tipo, monto));
    $('#gAdel').value = sinDescuentos ? '0' : C.miles(tipo === 'sueldo' ? Math.min(saldo, Math.max(0, monto - ipsDe(p, tipo, monto))) : 0);
    $('#gSug').textContent = sug;
    neto();
  }
  $('#gPersona').addEventListener('change', sugerir);
  $('#gTipo').addEventListener('change', sugerir);
  $('#gMonto').addEventListener('input', () => {
    const p = persona(val('gPersona'));
    $('#gIps').value = C.miles(ipsDe(p, val('gTipo'), num(val('gMonto'))));
    neto();
  });
  ['gIps', 'gAdel', 'gDesde', 'gHasta'].forEach(id => document.getElementById(id).addEventListener('input', neto));
  ['gMonto', 'gIps', 'gAdel'].forEach(id => document.getElementById(id).addEventListener('blur', () => { fmt(id); neto(); }));
  if (nuevo && !inicial?.monto) sugerir(); else { $('#cDias').hidden = base.tipo !== 'vacaciones'; $('#cPeriodo').hidden = base.tipo === 'adelanto'; neto(); }
}

async function guardarPago(id) {
  const tipo = val('gTipo');
  const o = {
    id: id || '', personaId: val('gPersona'), tipo, fecha: val('gFecha'),
    periodoDesde: tipo === 'adelanto' ? val('gFecha') : val('gDesde'), periodoHasta: tipo === 'adelanto' ? val('gFecha') : val('gHasta'),
    monto: num(val('gMonto')), ipsTrabajador: (tipo === 'aguinaldo' || tipo === 'adelanto') ? 0 : num(val('gIps')),
    adelantoDescontado: (tipo === 'aguinaldo' || tipo === 'adelanto') ? 0 : num(val('gAdel')),
    dias: tipo === 'vacaciones' ? num(val('gDias')) : 0, medio: val('gMedio'), nota: val('gNota').trim()
  };
  o.neto = o.monto - o.ipsTrabajador - o.adelantoDescontado;
  const otros = S.pagos.filter(x => x.id !== id);
  const saldo = C.saldoAdelantos(otros, o.personaId);
  let err = '';
  if (!o.personaId) err = 'Elige a la persona.';
  else if (!o.fecha) err = 'Falta la fecha de pago.';
  else if (!o.periodoDesde || !o.periodoHasta || o.periodoDesde > o.periodoHasta) err = 'Revisa el período: el inicio debe ser anterior al fin.';
  else if (o.monto <= 0 && tipo !== 'vacaciones') err = 'Falta el monto.';
  else if (tipo === 'vacaciones' && o.dias <= 0) err = 'Indica cuántos días de vacaciones tomó.';
  else if (o.adelantoDescontado > saldo) err = `Solo hay ${C.miles(saldo)} de adelantos por descontar.`;
  else if (o.neto < 0) err = 'Los descuentos superan el monto.';
  if (err) { $('#gError').textContent = err; return; }
  if (tipo === 'sueldo') {
    const choca = otros.find(x => !x.anulado && x.tipo === 'sueldo' && x.personaId === o.personaId && x.periodoDesde <= o.periodoHasta && x.periodoHasta >= o.periodoDesde);
    if (choca) {
      if (!await preguntar(`Ya hay un sueldo registrado para el ${C.etiquetaPeriodo(choca.periodoDesde, choca.periodoHasta)}. ¿Registrar este también?`, 'Sí, registrar', 'No')) return;
      o._forzar = true;
    }
  }
  if (id) o._version = version(S.pagos.find(x => x.id === id)); else { o.id = nuevoId(); o.nuevo = true; }
  const cierre = hoja.dataset.cerrar ? JSON.parse(hoja.dataset.cerrar) : null;
  await llamar('guardar', 'Pagos', o);
  delete hoja.dataset.cerrar;
  cerrar(); avisar('Pago guardado');
  if (cierre && tipo === 'liquidacion') {
    const per = persona(cierre.id);
    if (per && per.activo && await preguntar(`¿Marcar que ${per.nombre} dejó de trabajar el ${C.fechaCorta(cierre.salida, true)}? Así la app deja de esperar sueldos.`, 'Sí, marcar', 'Todavía no')) {
      await llamar('guardar', 'Personas', { id: per.id, activo: false, fechaSalida: cierre.salida, _version: version(per) });
    }
  }
  verPago(o.id);
}

function verPago(id) {
  const p = S.pagos.find(x => x.id === id);
  if (!p) return;
  const per = persona(p.personaId) || {};
  const linea = (k, v) => `<div class="linea-r"><span>${k}</span><span class="num">${v}</span></div>`;
  const numero = S.pagos.slice().sort((a, b) => (a.creadoEn || '').localeCompare(b.creadoEn || '')).findIndex(x => x.id === p.id) + 1;
  const periodoLargo = (a, b) => {
    const f = x => { const [yy, mm, dd] = x.split('-').map(Number); return `${dd} de ${C.MESES_LARGOS[mm - 1]} de ${yy}`; };
    const et = C.etiquetaPeriodo(a, b);
    if (/^año/.test(et)) return 'del ' + et;
    if (/^[a-z]+ \d{4}$/.test(et)) return 'de ' + et.replace(' ', ' de ');
    return a === b ? 'del ' + f(a) : `del ${f(a).replace(/ de \d{4}$/, a.slice(0, 4) === b.slice(0, 4) ? '' : '$&').replace(/ de [a-z]+$/, a.slice(0, 7) === b.slice(0, 7) ? '' : '$&')} al ${f(b)}`;
  };
  const [y, m, d] = p.fecha.split('-').map(Number);
  const textoWa = `Recibo de pago · ${per.nombre}\n${C.TIPOS[p.tipo]}${p.tipo !== 'adelanto' ? ' ' + C.etiquetaPeriodo(p.periodoDesde, p.periodoHasta) : ''}\nBruto: ${GT(p.monto)}${p.ipsTrabajador ? `\nIPS 9 %: −${C.miles(p.ipsTrabajador)}` : ''}${p.adelantoDescontado ? `\nAdelanto: −${C.miles(p.adelantoDescontado)}` : ''}\nNeto: ${GT(p.neto)}\nFecha: ${d}/${m}/${y}`;
  abrir('Recibo', `
    <div class="recibo" id="recibo">
      <h3>Recibo de ${E((C.TIPOS[p.tipo] || '').toLowerCase())}</h3>
      <div class="rol">${E(S.config.nombreHogar || '')} · Fecha de pago: ${d} de ${C.MESES_LARGOS[m - 1]} de ${y}</div>
      ${p.anulado ? '<p><span class="tag atrasado">ANULADO</span></p>' : ''}
      <p class="rol">Recibo n.º ${String(numero).padStart(4, '0')}</p>
      <p>Yo, <b>${E(per.nombre || '')}</b>${per.documento ? `, C.I. ${E(per.documento)},` : ','} recibí de ${E(S.config.nombreHogar || 'mi empleador')} la suma de <b class="num">${G(p.neto)}</b> en concepto de ${E((C.TIPOS[p.tipo] || '').toLowerCase())}${p.tipo !== 'adelanto' && p.tipo !== 'liquidacion' ? ' por el período ' + E(periodoLargo(p.periodoDesde, p.periodoHasta)) : ''}${p.dias ? ` (${p.dias} días)` : ''}.</p>
      <p class="letras">Son ${E(C.letrasGuaranies(p.neto))}.</p>
      ${linea(p.tipo === 'sueldo' ? 'Sueldo del período' : 'Importe', 'Gs. ' + C.miles(p.monto))}
      ${p.ipsTrabajador ? linea(`Descuento IPS (${String(Math.round(S.config.ipsTrabajador * 1000) / 10).replace('.', ',')} %)`, '− Gs. ' + C.miles(p.ipsTrabajador)) : ''}
      ${p.adelantoDescontado ? linea('Adelanto descontado', '− Gs. ' + C.miles(p.adelantoDescontado)) : ''}
      ${linea('<b>Neto recibido</b>', '<b>Gs. ' + C.miles(p.neto) + '</b>')}
      <div class="linea-r"><span>Medio de pago</span><span class="medio">${E(p.medio)}</span></div>
      ${p.nota ? `<p class="nota-pie">${E(p.nota)}</p>` : ''}
      <div class="firmas"><div>${E(per.nombre || '')}${per.documento ? '<br>C.I. ' + E(per.documento) : ''}</div><div>${E(S.config.nombreHogar || '')}<br>Por el empleador</div></div>
    </div>
    <p class="nota-pie no-imprimir">Cargado por ${E(p.creadoPor || '—')}${p.editadoPor ? ` · editado por ${E(p.editadoPor)}` : ''}</p>`,
    `<button class="btn sec" data-accion="editarPago" data-id="${E(p.id)}">Editar</button>
     <a class="btn sec" style="text-decoration:none" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(textoWa)}">WhatsApp</a>
     <button class="btn" data-accion="imprimir">Imprimir</button>`);
}

function formLiquidacion(id) {
  const p = persona(id);
  const hoy = C.hoy();
  const est = C.estadoPersona(p, S.pagos, hoy);
  const desde = est.ultimoPagado ? C.sumarDias(est.ultimoPagado, 1) : p.controlDesde || p.fechaIngreso;
  const diasPend = C.diasComerciales(desde, hoy);
  abrir('Liquidación', `
    <div class="campo"><label for="lSalida">Último día de trabajo</label><input id="lSalida" type="date" value="${hoy}"></div>
    <div>
      <div class="campo"><label for="lMotivo">Motivo</label><select id="lMotivo">
        <option value="despido">Despido sin causa justificada</option><option value="renuncia">Renuncia</option><option value="justificado">Despido con causa justificada</option></select></div>
    </div>
    <div class="doble">
      <div class="campo"><label for="lDias">Días trabajados sin cobrar</label><input id="lDias" inputmode="numeric" value="${diasPend}"><span class="ayuda">Desde el último sueldo registrado, con meses de 30 días.</span></div>
      <label class="check"><input type="checkbox" id="lPreaviso"> Se dio el preaviso por escrito</label>
    </div>
    <div id="lResultado"></div>
    ${(p.controlDesde || '') > hoy.slice(0, 4) + '-01-01' && (p.controlDesde || '') > p.fechaIngreso ? `<p class="nota-pie" style="color:var(--ambar)">El aguinaldo solo cuenta lo registrado desde el ${C.fechaCorta(p.controlDesde, true)}. Suma a mano la doceava parte de lo cobrado antes.</p>` : ''}
    <p class="nota-pie">Es una estimación con lo registrado en la app. Antes de pagar, conviene pedir la liquidación al MTESS (gratis, internos 551 a 553 del 021 729 0100). Durante el embarazo o la lactancia el despido es nulo (Ley 5508/15).</p>`,
    `<button class="btn sec" data-accion="cerrar">Cerrar</button><button class="btn" data-accion="registrarLiquidacion" data-id="${E(p.id)}">Registrar como pago</button>`, E(p.nombre));
  let diasTocados = false;
  document.getElementById('lDias').addEventListener('input', () => { diasTocados = true; });
  const calcular = () => {
    const salida = val('lSalida') || hoy;
    if (salida < p.fechaIngreso) { $('#lResultado').innerHTML = '<p class="error">La salida no puede ser anterior al ingreso.</p>'; hoja.dataset.liquidacion = ''; return; }
    if (!diasTocados) $('#lDias').value = Math.max(0, salida >= desde ? C.diasComerciales(desde, salida) : 0);
    const r = C.liquidar(p, S.pagos, S.config, { fechaSalida: salida, motivo: val('lMotivo'), preavisoOtorgado: $('#lPreaviso').checked, diasPendientes: num(val('lDias')) });
    hoja.dataset.liquidacion = JSON.stringify(Object.assign({ salida, motivo: r.motivo }, r.registro));
    $('#lResultado').innerHTML = `
      <p class="nota-pie">Antigüedad: ${tiempo(r.antiguedad)}${r.motivo === 'prueba' ? ' · <b>dentro del período de prueba</b>: sin preaviso ni indemnización' : ''}. Jornal promedio: ${C.miles(r.jornalPromedio.jornal)}${r.jornalPromedio.conRegistros ? `, con lo cobrado del ${C.etiquetaPeriodo(r.jornalPromedio.desde, r.jornalPromedio.hasta)} (hasta seis meses${r.jornalPromedio.huecos ? '; hay meses sin sueldo registrado y no se cuentan' : ''})` : ' (sin registros: se usó el sueldo acordado)'}.</p>
      <div class="desplaza"><table class="tabla"><thead><tr><th>Concepto</th><th>Gs.</th></tr></thead><tbody>
      ${r.items.map(i => `<tr><td>${E(i.concepto)}<div class="nota-pie" style="margin:2px 0 0">${E(i.detalle)}</div></td><td class="num">${C.miles(i.monto)}</td></tr>`).join('')}
      </tbody><tfoot><tr><td>Total a entregar</td><td class="num">${C.miles(Math.max(0, r.total))}</td></tr></tfoot></table></div>
      ${r.registro.deudaAdelantos > 0 ? `<p class="nota-pie" style="color:var(--sello)">Los adelantos superan lo que se le debe: quedan ${G(r.registro.deudaAdelantos)} sin cubrir.</p>` : ''}`;
  };
  ['lSalida', 'lMotivo', 'lDias', 'lPreaviso'].forEach(i => document.getElementById(i).addEventListener('input', calcular));
  calcular();
}

// ---------- eventos ----------
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-accion],[data-vista]');
  if (!b) return;
  if (b.dataset.vista) { S.vista = b.dataset.vista; render(); window.scrollTo(0, 0); return; }
  const id = b.dataset.id;
  const acc = b.dataset.accion;
  try {
    if (acc === 'cerrar') cerrar();
    else if (acc === 'nuevaPersona') formPersona();
    else if (acc === 'editarPersona') formPersona(persona(id));
    else if (acc === 'guardarPersona') { b.disabled = true; await guardarPersona(id).finally(() => { b.disabled = false; }); }
    else if (acc === 'verPersona') { S.vista = 'persona'; S.personaId = id; render(); window.scrollTo(0, 0); }
    else if (acc === 'pagar') formPago(null, { personaId: id, tipo: 'sueldo' });
    else if (acc === 'adelanto') formPago(null, { personaId: id, tipo: 'adelanto' });
    else if (acc === 'nuevoPagoPersona') formPago(null, { personaId: id, tipo: 'extra' });
    else if (acc === 'nuevoPago') formPago(null, { personaId: S.filtroPersona || '' });
    else if (acc === 'guardarPago') { b.disabled = true; await guardarPago(id).finally(() => { b.disabled = false; }); }
    else if (acc === 'verPago') verPago(id);
    else if (acc === 'editarPago') formPago(S.pagos.find(x => x.id === id));
    else if (acc === 'anularPago') {
      const p = S.pagos.find(x => x.id === id);
      const yaDescontado = p.tipo === 'adelanto' && !p.anulado && C.saldoAdelantos(S.pagos.filter(x => x.id !== p.id), p.personaId) < 0;
      if (!await preguntar(p.anulado ? '¿Restaurar este pago?' : (yaDescontado ? 'Este adelanto ya se descontó de un sueldo: si lo anulas, el saldo de adelantos quedará negativo. Anula también ese descuento editando el sueldo. ' : '') + '¿Anular este pago? Queda tachado en el registro y deja de contar en los cálculos.', p.anulado ? 'Sí, restaurar' : 'Sí, anular', 'No')) return;
      await llamar('guardar', 'Pagos', { id, anulado: !p.anulado, _version: version(p) }); cerrar(); avisar(p.anulado ? 'Pago restaurado' : 'Pago anulado');
    }
    else if (acc === 'liquidacion') formLiquidacion(id);
    else if (acc === 'registrarLiquidacion') {
      if (!hoja.dataset.liquidacion) return;
      const l = JSON.parse(hoja.dataset.liquidacion);
      const motivos = { despido: 'despido sin causa', justificado: 'despido con causa', renuncia: 'renuncia', prueba: 'fin del período de prueba' };
      formPago(null, { personaId: id, tipo: 'liquidacion', fecha: C.hoy(), periodoDesde: l.salida, periodoHasta: l.salida, monto: l.monto, ipsTrabajador: l.ipsTrabajador, adelantoDescontado: l.adelantoDescontado, nota: 'Liquidación final por ' + motivos[l.motivo] + (l.deudaAdelantos ? `; quedan ${C.miles(l.deudaAdelantos)} de adelantos sin cubrir` : '') });
      hoja.dataset.cerrar = JSON.stringify({ id, salida: l.salida });
    }
    else if (acc === 'imprimir') window.print();
    else if (acc === 'quitarFiltro') { S.filtroPersona = ''; S.filtroMes = ''; render(); }
  } catch (err) { /* el aviso ya se mostró */ }
});

document.addEventListener('change', e => {
  if (e.target.id === 'fPersona') { S.filtroPersona = e.target.value; render(); }
  if (e.target.id === 'fMes') { S.filtroMes = e.target.value; render(); }
  if (e.target.id === 'rMes' && e.target.value) { S.mesResumen = e.target.value; render(); }
});

document.addEventListener('submit', async e => {
  if (e.target.id === 'fLlave') {
    e.preventDefault();
    const v = (document.getElementById('lLlave').value || '').trim();
    if (!/^[A-Za-z0-9_-]{32,}$/.test(v)) { avisar('Esa llave no tiene el formato correcto.', true); return; }
    llave = v; try { localStorage.setItem(CLAVE_LLAVE, v); } catch (err) {}
    S.vista = 'inicio';
    llamar('cargar').catch(() => {});
    return;
  }
  if (e.target.id !== 'fAjustes') return;
  e.preventDefault();
  const f = e.target.elements;
  const pct = v => Number(String(v).replace(',', '.')) / 100;
  const cfg = {
    nombreHogar: f.nombreHogar.value.trim(), salarioMinimo: num(f.salarioMinimo.value), horaTiempoParcial: num(f.horaTiempoParcial.value), smVigencia: f.smVigencia.value, smFuente: f.smFuente.value.trim(),
    ipsTrabajador: pct(f.ipsTrabajador.value), ipsEmpleador: pct(f.ipsEmpleador.value), ipsComplementoSalud: pct(f.ipsComplementoSalud.value), bonifFamiliar: pct(f.bonifFamiliar.value)
  };
  if (!cfg.salarioMinimo || [cfg.ipsTrabajador, cfg.ipsEmpleador, cfg.ipsComplementoSalud, cfg.bonifFamiliar].some(x => isNaN(x) || x < 0 || x > 1)) { avisar('Revisa los valores: hay un número inválido.', true); return; }
  cfg._version = String(S.config.editadoEn || '');
  await llamar('guardarConfig', cfg); avisar('Ajustes guardados');
});

$('#recargar').addEventListener('click', () => llamar('cargar').then(() => avisar('Datos al día')));
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && !hoja.open && S.vista !== 'llave' && (!enLinea || llave)) llamar('cargar').catch(() => {}); });

// ---------- modo demostración (fuera de Google) ----------
const Demo = (() => {
  const CLAVE = 'pagosHogarDemo';
  const cfg = { nombreHogar: 'Familia Ejemplo', salarioMinimo: 3044000, horaTiempoParcial: 14635, smVigencia: '2026-07-01', smFuente: 'Decreto 6225/2026 y Resolución MTESS 670/2026, según la prensa. Confirmar en mtess.gov.py', ipsTrabajador: 0.09, ipsEmpleador: 0.165, ipsComplementoSalud: 0.09, bonifFamiliar: 0.05 };
  function semilla() {
    const pers = [
      { id: 'd1', nombre: 'Rosa Benítez', funcion: 'Niñera', documento: '', fechaIngreso: '2024-03-04', controlDesde: '2026-09-01', modalidad: 'con retiro', jornada: 'completa', horasSemana: 48, sueldoMensual: 3200000, frecuencia: 'quincenal', ips: true, hijosMenores: 1, activo: true, fechaSalida: '', notas: '', vacacionesIniciales: 12 },
      { id: 'd2', nombre: 'Julio Acosta', funcion: 'Jardinero', documento: '', fechaIngreso: '2025-08-01', controlDesde: '2026-09-01', modalidad: 'con retiro', jornada: 'parcial', horasSemana: 16, sueldoMensual: 950000, frecuencia: 'mensual', ips: false, hijosMenores: 0, activo: true, fechaSalida: '', notas: '', vacacionesIniciales: 12 }
    ];
    const pg = [];
    let n = 0;
    const add = o => pg.push(Object.assign({ id: 'p' + (++n), anulado: false, medio: 'Efectivo', nota: '', dias: 0, ipsTrabajador: 0, adelantoDescontado: 0, creadoPor: 'demo@ejemplo', creadoEn: '2026-01-01T00:00:' + String(n).padStart(2, '0') }, o, { neto: o.monto - (o.ipsTrabajador || 0) - (o.adelantoDescontado || 0) }));
    [['2026-09-01', '2026-09-15'], ['2026-09-16', '2026-09-30'], ['2026-10-01', '2026-10-15']].forEach(([a, b]) =>
      add({ personaId: 'd1', tipo: 'sueldo', fecha: b, periodoDesde: a, periodoHasta: b, monto: 1600000, ipsTrabajador: 144000 }));
    add({ personaId: 'd1', tipo: 'adelanto', fecha: '2026-10-22', periodoDesde: '2026-10-22', periodoHasta: '2026-10-22', monto: 300000 });
    add({ personaId: 'd2', tipo: 'sueldo', fecha: '2026-10-03', periodoDesde: '2026-09-01', periodoHasta: '2026-09-30', monto: 950000 });
    add({ personaId: 'd2', tipo: 'sueldo', fecha: '2026-11-04', periodoDesde: '2026-10-01', periodoHasta: '2026-10-31', monto: 950000, medio: 'Transferencia' });
    return { personas: pers, pagos: pg, config: cfg };
  }
  const leer = () => { try { const t = localStorage.getItem(CLAVE); if (t) return JSON.parse(t); } catch (e) {} return semilla(); };
  const escribir = d => { try { localStorage.setItem(CLAVE, JSON.stringify(d)); } catch (e) {} };
  let datos = leer();
  const salida = () => JSON.parse(JSON.stringify(Object.assign({}, datos, { usuario: 'modo demostración', url: '' })));
  return {
    cargar: () => salida(),
    guardar(hojaNombre, o) {
      o = Object.assign({}, o); delete o.nuevo; delete o._version; delete o._forzar;
      const lista = hojaNombre === 'Personas' ? datos.personas : datos.pagos;
      const i = o.id ? lista.findIndex(x => x.id === o.id) : -1;
      const ahora = new Date().toISOString();
      if (i >= 0) lista[i] = Object.assign({}, lista[i], o, { editadoPor: 'demo@ejemplo', editadoEn: ahora });
      else lista.push(Object.assign({}, o, { creadoPor: 'demo@ejemplo', creadoEn: ahora }));
      escribir(datos); return salida();
    },
    guardarConfig(c) { c = Object.assign({}, c); delete c._version; datos.config = Object.assign({}, datos.config, c); escribir(datos); return salida(); }
  };
})();

else { render(); llamar('cargar').catch(() => {}); }
